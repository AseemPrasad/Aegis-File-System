global:
  environment: production

ingress:
  replicaCount: 3
  image:
    repository: aegis-ingress
    tag: "1.0.0"
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"

worker:
  replicaCount: 2
  image:
    repository: aegis-worker
    tag: "1.0.0"
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
