# ============================================================================
# Project Aegis — Application ConfigMap
#
# Non-secret configuration for the aegis-ingestion and derivation-workers
# deployments. Secrets are in 01-secrets.yaml.
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis
  labels:
    app.kubernetes.io/part-of: aegis
data:
  # Ingress server
  AEGIS_HTTP_PORT: "8080"
  AEGIS_LOG_LEVEL: info
  AEGIS_LOG_FORMAT: json

  # Object storage backend (s3 | minio | edgepop)
  AEGIS_STORAGE_BACKEND: minio

  # Derivation pipeline
  AEGIS_DERIVATION_ENABLED: "true"
  AEGIS_WORKER_CONCURRENCY: "4"
  AEGIS_MAX_QUEUE_DEPTH: "1000"

  # Garbage collection
  AEGIS_GC_ENABLED: "true"
  AEGIS_GC_INTERVAL: "1h"
  AEGIS_GC_BATCH_SIZE: "1000"

  # Database
  AEGIS_MIN_CONNS_PER_POOL: "2"
  AEGIS_MAX_CONNS_PER_POOL: "20"

  # CAS thresholds
  AEGIS_CAS_HOT_THRESHOLD: "100"
  AEGIS_CAS_WARM_THRESHOLD: "10"
