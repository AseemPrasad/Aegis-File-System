# ============================================================================
# Project Aegis — NetworkPolicy: Allow Prometheus
#
# Prometheus egress: scrape all aegis pods + query K8s API.
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: aegis
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aegis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Grafana reads from Prometheus
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    # Scrape all aegis pods
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aegis
      ports:
        - port: 8080
          protocol: TCP
        - port: 9187
          protocol: TCP
        - port: 9121
          protocol: TCP
    # K8s API (for service discovery)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 6443
          protocol: TCP
