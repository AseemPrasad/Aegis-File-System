# ============================================================================
# Project Aegis — NetworkPolicy: Allow Aegis Ingress
#
# aegis-ingestion pods accept traffic from:
#   - Other aegis pods (intra-namespace)
#   - The K8s ingress controller (namespace: ingress-nginx)
#   - Prometheus (scrape /metrics)
#
# aegis-ingestion egress:
#   - PostgreSQL (5432)
#   - Redis (6379)
#   - S3/MinIO (9000)
#   - Jaeger (4317 OTLP gRPC)
#   - DNS (kube-dns)
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-ingestion
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-ingestion
    app.kubernetes.io/part-of: aegis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aegis-ingestion
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from other aegis pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aegis
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
    # Allow Prometheus scrape
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # S3/MinIO (external or in-namespace)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 9000
          protocol: TCP
        - port: 443
          protocol: TCP
    # Jaeger OTLP gRPC
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - port: 4317
          protocol: TCP
