# ============================================================================
# Project Aegis — NetworkPolicy: Default Deny All
#
# Baseline: deny all ingress and egress in the aegis namespace.
# Subsequent policies whitelist required traffic.
# Requires a CNI that supports NetworkPolicy (Calico, Cilium, etc.).
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aegis
  labels:
    app.kubernetes.io/part-of: aegis
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
