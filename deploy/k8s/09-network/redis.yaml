# ============================================================================
# Project Aegis — NetworkPolicy: Allow Redis
#
# Redis accepts connections only from aegis pods.
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: aegis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: aegis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from other aegis pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aegis
    # Allow redis-exporter
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-exporter
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    # Redis replication (pod-to-pod)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
