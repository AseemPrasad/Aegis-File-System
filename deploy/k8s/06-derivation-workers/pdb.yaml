# ============================================================================
# Project Aegis — PodDisruptionBudget (derivation-workers)
#
# At least 1 worker must remain available during voluntary disruptions.
# ============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegis-derivation-workers
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-derivation-workers
    app.kubernetes.io/part-of: aegis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-derivation-workers
