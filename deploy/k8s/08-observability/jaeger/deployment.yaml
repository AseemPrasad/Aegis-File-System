# ============================================================================
# Project Aegis — Jaeger (all-in-one)
#
# Single-binary Jaeger for development/staging. In production, replace with
# a collector + elasticsearch/cassandra backend.
#
# Agent is deployed as a sidecar to each Aegis pod; collector runs
# standalone. UI is exposed on port 16686.
#
# OpenTelemetry collector receives spans from app via OTLP/gRPC on 4317.
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: aegis
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: aegis
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 14268
              name: collector-http
            - containerPort: 14250
              name: collector-grpc
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 6831
              name: agent-compact
              protocol: UDP
            - containerPort: 5775
              name: agent-zipkin
              protocol: UDP
          env:
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "badger"
            - name: BADGER_DIRECTORY_VALUE
              value: "/badger/data"
            - name: BADGER_DIRECTORY_KEY
              value: "/badger/key"
          volumeMounts:
            - name: badger-data
              mountPath: /badger
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: badger-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: aegis
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: aegis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - port: 16686
      targetPort: ui
      name: ui
    - port: 4317
      targetPort: otlp-grpc
      name: otlp-grpc
    - port: 4318
      targetPort: otlp-http
      name: otlp-http
    - port: 14268
      targetPort: collector-http
      name: collector-http
    - port: 14250
      targetPort: collector-grpc
      name: collector-grpc
---
# Headless service for agent discovery
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: aegis
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: aegis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - port: 6831
      targetPort: agent-compact
      name: compact
      protocol: UDP
    - port: 5775
      targetPort: agent-zipkin
      name: zipkin
      protocol: UDP
