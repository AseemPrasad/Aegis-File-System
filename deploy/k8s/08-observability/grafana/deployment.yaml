# ============================================================================
# Project Aegis — Grafana Deployment + Service
#
# Provisions Prometheus datasource and Aegis dashboards from ConfigMaps.
# Admin credentials are DEV-ONLY placeholders.
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: aegis
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: aegis
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: dev_admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: grafana-admin-password
                  optional: true
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: dev_grafana_only
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/provisioning
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: dashboards
          configMap:
            name: aegis-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: aegis
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: aegis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - port: 3000
      targetPort: http
      name: http
