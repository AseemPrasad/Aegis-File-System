# ============================================================================
# Project Aegis — Aegis Ingestion Service
#
# ClusterIP service for internal traffic (Prometheus scraping, internal callers).
# Expose externally via an Ingress or LoadBalancer resource as needed.
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: aegis-ingestion
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-ingestion
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: aegis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis-ingestion
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
---
# External-facing LoadBalancer (optional — comment out if using Ingress controller)
apiVersion: v1
kind: Service
metadata:
  name: aegis-ingestion-external
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-ingestion
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: aegis
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: aegis-ingestion
  ports:
    - port: 443
      targetPort: http
      protocol: TCP
      name: https
