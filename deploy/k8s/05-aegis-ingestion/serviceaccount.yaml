# ============================================================================
# Project Aegis — ServiceAccount (aegis-ingestion)
#
# Minimal RBAC for the ingestion pod. The pod itself only talks to
# Postgres, Redis, S3/MinIO — no K8s API access needed.
# ============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-ingestion
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-ingestion
    app.kubernetes.io/part-of: aegis
automountServiceAccountToken: false
