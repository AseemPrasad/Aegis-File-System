# ============================================================================
# Project Aegis — integration & local development stack (PROMPT 1.2)
#
# Scope: single-node everything, matching the "integration testing" template
# in docs/CICD_PIPELINE.md §Environments. Production parity comes from
# deploy/terraform (multi-AZ RDS/ElastiCache/S3) — same wire protocols,
# different durability posture.
#
# Usage:  docker compose -f deploy/compose/docker-compose.yml up -d --wait
# Teardown with data wipe:  ... down -v
#
# All credentials here are DEV-ONLY placeholders. Never reuse outside the
# compose network; production secrets are injected from Vault/KMS.
# ============================================================================

name: aegis-integration

services:
  # ------------------------------------------------------------- metadata
  postgres:
    image: postgres:16-alpine            # pinned minor via digest in CI
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: dev_admin_only
      # Deterministic collation for unique-name constraint behavior.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - log_min_duration_statement=50     # IC-3 slow-query contract
      - -c
      - shared_preload_libraries=pg_stat_statements
    # NOTE: a second port is published because developer machines often run
    # a native PostgreSQL on 5432; 15432 is unambiguous for host-side tools.
    ports:
      - "5432:5432"
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/001_bootstrap.sql:/docker-entrypoint-initdb.d/001_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://aegis_admin:dev_admin_only@postgres:5432/aegis?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  # ----------------------------------------------------------------- cache
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dev_redis_only"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a dev_redis_only ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: dev_redis_only
    depends_on:
      redis: { condition: service_healthy }

  # ------------------------------------------------------------ event bus
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode dev-container          # relaxed fsync/dev settings
      - --smp "1"
      - --memory 1G
      - --reserve-memory 0M
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"                   # Kafka API
      - "9644:9644"                   # Admin/Prometheus
    volumes: [rp_data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=redpanda:9092"]
      interval: 10s
      timeout: 5s
      retries: 12

  redpanda-console:
    image: redpandadata/console:v2.7.1
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8085:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  # ------------------------------------------------------------ blob store
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dev_minio_root
      MINIO_ROOT_PASSWORD: dev_minio_root_only   # <72 chars required by MinIO
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2024-08-26T15-33-02Z
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: dev_minio_root
      MINIO_ROOT_PASSWORD: dev_minio_root_only
    volumes:
      - ./init/minio-init.sh:/init/minio-init.sh:ro
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  # ------------------------------------------------------------ monitoring
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: dev_admin
      GF_SECURITY_ADMIN_PASSWORD: dev_grafana_only
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]

  # Ingress skeleton under test (proves image + wiring end-to-end).
  # No in-container healthcheck: distroless runtime intentionally ships no
  # probe binaries; CI gates readiness externally via `curl /ready`.
  ingest:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ingest
    environment:
      AEGIS_HTTP_PORT: "8080"
    ports: ["8080:8080"]

volumes:
  pg_data: {}
  redis_data: {}
  rp_data: {}
  minio_data: {}
