<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Shield Neon Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="50%" stop-color="#54a0ff"/>
      <stop offset="100%" stop-color="#5f27cd"/>
    </linearGradient>

    <!-- Core Core Sparkle -->
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Subtitle Glow Gradient -->
    <linearGradient id="subtext-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background with Rounded Border -->
  <rect width="800" height="240" rx="24" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Subtle Cyber Mesh Line Overlay -->
  <path d="M 0 60 Q 400 120 800 60 M 0 180 Q 400 120 800 180" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" fill="none"/>

  <!-- Left Emblem Group: Aegis Shield Mark -->
  <g transform="translate(90, 120)">
    <!-- Outer Hex Glow Halo -->
    <polygon points="0,-72 60,-35 60,35 0,72 -60,35 -60,-35" fill="none" stroke="url(#shield-grad)" stroke-width="2.5" filter="url(#neon-glow)" opacity="0.8"/>
    
    <!-- Inner Solid Aegis Shield -->
    <path d="M 0,-54 L 42,-26 C 42,25 20,48 0,58 C -20,48 -42,25 -42,-26 Z" fill="url(#bg-grad)" stroke="url(#shield-grad)" stroke-width="3.5"/>

    <!-- Content-Addressed Circuit / Data Nodes inside Shield -->
    <circle cx="0" cy="-18" r="5" fill="url(#core-grad)"/>
    <circle cx="-18" cy="12" r="4" fill="url(#core-grad)"/>
    <circle cx="18" cy="12" r="4" fill="url(#core-grad)"/>
    <circle cx="0" cy="30" r="4" fill="url(#core-grad)"/>

    <!-- Interconnecting Topology Circuit Lines -->
    <path d="M 0,-18 L -18,12 M 0,-18 L 18,12 M -18,12 L 0,30 M 18,12 L 0,30" stroke="url(#core-grad)" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Right Typography Group -->
  <g transform="translate(195, 0)">
    <!-- Main Title -->
    <text x="0" y="112" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="4" fill="url(#text-grad)">
      PROJECT AEGIS
    </text>

    <!-- Subtitle Badge / Tagline -->
    <text x="0" y="152" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="3" fill="url(#subtext-grad)">
      EXABYTE-SCALE · CONTENT-ADDRESSED · ZERO-TRUST ENGINE
    </text>

    <!-- Tech Badges Pill Row -->
    <g transform="translate(0, 172)">
      <!-- Pill 1: SIMD FastCDC -->
      <rect x="0" y="0" width="125" height="26" rx="13" fill="rgba(224, 86, 253, 0.12)" stroke="rgba(224, 86, 253, 0.4)" stroke-width="1"/>
      <text x="62.5" y="17" font-family="sans-serif" font-weight="700" font-size="11" fill="#e056fd" text-anchor="middle">RUST FASTCDC</text>

      <!-- Pill 2: Go Ingress -->
      <rect x="135" y="0" width="125" height="26" rx="13" fill="rgba(84, 160, 255, 0.12)" stroke="rgba(84, 160, 255, 0.4)" stroke-width="1"/>
      <text x="197.5" y="17" font-family="sans-serif" font-weight="700" font-size="11" fill="#54a0ff" text-anchor="middle">GO INGRESS API</text>

      <!-- Pill 3: PostgreSQL ltree -->
      <rect x="270" y="0" width="145" height="26" rx="13" fill="rgba(95, 39, 205, 0.12)" stroke="rgba(95, 39, 205, 0.4)" stroke-width="1"/>
      <text x="342.5" y="17" font-family="sans-serif" font-weight="700" font-size="11" fill="#a55eea" text-anchor="middle">POSTGRESQL LTREE</text>
    </g>
  </g>
</svg>
