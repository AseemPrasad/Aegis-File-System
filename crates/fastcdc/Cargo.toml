# ============================================================================
# aegis-fastcdc — Content-Defined Chunking engine (data plane)
#
# Implements invariant I-1 surface types. Algorithm internals (Gear hashing,
# two-phase masking, SIMD cut-points) are delivered by PROMPT 3.1; this
# manifest freezes the dependency + benchmark harness so gates run from day 1.
# ============================================================================

[package]
name         = "aegis-fastcdc"
description  = "FastCDC content-defined chunking with SHA-256 addressing for Project Aegis"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }
rand      = { workspace = true }

[[bench]]
name    = "chunking"
harness = false

[lints.rust]
# PROMPT 3.1: forbid -> deny so the SIMD modules can take a *scoped*
# #[allow(unsafe_code)] with mandatory SAFETY comments; every other module
# still rejects unsafe outright. The allow sites are: simd_x86.rs, simd_arm.rs,
# and the single dispatch fn in scan.rs.
unsafe_code = "deny"

missing_docs = "warn"

[lints.clippy]
all      = "warn"
pedantic = "warn"             # CI runs clippy -- -D warnings (zero-warning gate)
