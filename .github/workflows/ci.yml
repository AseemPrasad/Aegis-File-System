# ============================================================================
# Project Aegis — CI/CD pipeline (PROMPT 1.2)
#
# Gate philosophy: every push is cheap-checked; expensive proofs (fuzz, perf,
# containers, security deep-scans) run on PRs to main and nightly schedules.
# Thresholds mirror docs/CICD_PIPELINE.md §Gates and the SLA matrix.
# ============================================================================

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly: fuzz soak + perf gate + dependency drift

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GHCR image push (main branch only)

env:
  COVERAGE_TARGET: "85"

jobs:
  # ------------------------------------------------------------------ RUST --
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt (zero-diff gate)
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings gate)
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: unit + property tests
        run: cargo test --workspace
      - name: coverage >= ${COVERAGE_TARGET}%
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines $COVERAGE_TARGET --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  rust-bench-gate:
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install critcmp --locked
      - name: restore baseline
        uses: actions/cache/restore@v4
        with:
          path: baseline
          key: critcmp-baseline-main
      - name: run vs baseline (>10% regression fails)
        run: |
          cargo bench -- --save-baseline current
          if [ -d baseline ]; then
            critcmp baseline current --threshold 10 || { echo "PERF GATE FAILED"; exit 1; }
          else
            echo "first run: promoting current run as baseline"
          fi
          mkdir -p baseline && cp -r target/criterion baseline/
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: baseline
          key: critcmp-baseline-main-${{ github.sha }}

  rust-fuzz-soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Property suites executed with an extended case budget approximate the
      # 1h fuzz soak required by PROMPT 9.1 until libfuzzer targets land in 3.1.
      - run: PROPTEST_CASES=100000 cargo test --workspace --release

  # -------------------------------------------------------------------- GO --
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt zero-diff
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: race-detector unit suite
        run: go test -race ./...
      - name: coverage >= ${COVERAGE_TARGET}%
        run: |
          go test -coverprofile=coverage.out ./...
          python scripts/coverage_gate.py coverage.out $COVERAGE_TARGET

  # ---------------------------------------------------------- INTEGRATION --
  integration:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: boot real dependency stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait
      - name: verify ltree prerequisite (invariant I-2)
        run: |
          docker compose -f deploy/compose/docker-compose.yml exec -T postgres \
            psql -U aegis_admin -d aegis -tAc \
            "SELECT extname FROM pg_extension WHERE extname = 'ltree'" | grep -qx ltree
      - name: health contract probe (IC-2 readiness surface)
        run: curl -fsS http://localhost:8080/ready
      # Integration suites tagged `//go:build integration` activate per-prompt:
      # 2.1 schema tests, 4.x upload workflows, 6.1 GC races, 7.1 CDC.
      - name: tagged integration suites
        run: go test -tags=integration -count=1 ./...
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  # -------------------------------------------------------------- SECURITY --
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rust supply-chain (advisories, bans, licenses)
        uses: EmbarkStudios/cargo-deny-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vulnerability database
        uses: golang/govulncheck-action@v1
      - name: SAST
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:latest semgrep --config auto --error --severity ERROR
      - name: filesystem misconfig + secret rescan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"

  # ------------------------------------------------------------ CONTAINERS --
  images:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, go-lint, go-test]
    strategy:
      matrix:
        include:
          - name: aegis-ingest
            file: docker/Dockerfile.ingest
          - name: aegis-fastcdc
            file: docker/Dockerfile.fastcdc
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.file }}
          tags: local/${{ matrix.name }}:candidate
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan image (CRITICAL/HIGH blocks promotion)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: local/${{ matrix.name }}:candidate
          severity: CRITICAL,HIGH
          exit-code: "1"
      - if: github.ref == 'refs/heads/main'
        name: push to GHCR
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest

  # ------------------------------------------------------------------ GATE --
  promote-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, go-lint, go-test, integration, security, images]
    steps:
      - uses: actions/checkout@v4
      - name: all quality gates green — artifacts promotable to staging
        run: echo "main is releasable at ${{ github.sha }}"
