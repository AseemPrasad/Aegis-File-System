# ============================================================================
# Project Aegis — Enterprise CI/CD pipeline
# ============================================================================

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly soak

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  COVERAGE_TARGET: "85"

jobs:
  # ------------------------------------------------------------------ RUST --
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt (zero-diff gate)
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings gate)
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: unit + property tests
        run: cargo test --workspace

  # -------------------------------------------------------------------- GO --
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.1

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit + race detector
        run: go test -v -race -coverprofile=coverage.out ./...

  # ------------------------------------------------------------------- WEB --
  web-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # -------------------------------------------------------------- SECURITY --
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: trivy fs scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH

  # ---------------------------------------------------------------- CHAOS --
  chaos-testing:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: run chaos engineering suite
        run: go test -v ./tests/chaos/...

  # ------------------------------------------------------------------ GATE --
  promote-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, go-lint, go-test, web-ci, security-scans, chaos-testing]
    steps:
      - uses: actions/checkout@v4
      - name: all enterprise quality & chaos gates green
        run: echo "main branch is production releasable at ${{ github.sha }}"
